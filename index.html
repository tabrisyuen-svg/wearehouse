<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>倉庫管理系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#1f2937}
nav{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#1f2937;border-bottom:1px solid #374151}
nav .logo{color:#fff;font-size:15px;font-weight:700;margin-right:8px;white-space:nowrap}
nav button{cursor:pointer;border:0;border-radius:6px;padding:8px 18px;font-size:14px;background:#374151;color:#9ca3af;min-height:36px;transition:background .15s,color .15s}
nav button.active{background:#2563eb;color:#fff}
nav button:hover:not(.active){background:#4b5563;color:#fff}
.frame-wrap{position:relative;width:100%;height:calc(100vh - 53px)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f4f5f7;opacity:0;pointer-events:none;transition:opacity .15s;overflow-y:scroll;-webkit-overflow-scrolling:touch}
iframe.active{opacity:1;pointer-events:auto}
</style>
</head>
<body>

<nav>
  <span class="logo">📦 倉庫管理</span>
  <button class="active" data-tab="search">🔍 查貨</button>
  <button data-tab="adjust">📝 庫存調整</button>
</nav>

<div class="frame-wrap">
  <iframe id="frameSearch" data-tab="search" data-src="./search.html" class="active"></iframe>
  <iframe id="frameAdjust" data-tab="adjust" data-src="./adjust.html"></iframe>
</div>

<script>
const btns   = document.querySelectorAll('nav button');
const frames = document.querySelectorAll('iframe');

/* 一開始先載入預設 tab（查貨） */
document.getElementById('frameSearch').src = './search.html';

function switchTab(tabName) {
  btns.forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
  frames.forEach(f => {
    const isActive = f.dataset.tab === tabName;
    f.classList.toggle('active', isActive);
    /* ✅ 修正1：用 getAttribute 判斷，避免 about:blank 誤判 */
    if (isActive && !f.getAttribute('src')) {
      f.src = f.dataset.src;
    }
  });
}

btns.forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ★ 接收查貨頁「調整此格位」的 postMessage */
window.addEventListener('message', e => {
  if (e.data?.type === 'navigate' && e.data.sku) {
    const adjFrame = document.getElementById('frameAdjust');

    /* ✅ 修正2：判斷 iframe 是否已載入，決定何時發 postMessage */
    if (adjFrame.getAttribute('src')) {
      /* 已載入過，切換 tab 後直接發 */
      switchTab('adjust');
      adjFrame.contentWindow.postMessage(e.data, '*');
    } else {
      /* 第一次，等載入完再發 */
      switchTab('adjust');
      adjFrame.addEventListener('load', function onLoad() {
        adjFrame.removeEventListener('load', onLoad);
        adjFrame.contentWindow.postMessage(e.data, '*');
      });
    }
  }
});
</script>
</body>
</html>
