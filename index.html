<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倉庫管理系統</title>
  <script src="./db.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #131929;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      background: #1a2744;
      border-bottom: 1px solid #1e3158;
      padding: 0 16px;
      display: flex;
      align-items: center;
      height: 44px;
      flex-shrink: 0;
    }

    #logo {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Tab Bar ── */
    #tabbar {
      background: #1a2744;
      border-bottom: 2px solid #1e3158;
      display: flex;
      align-items: stretch;
      padding: 0 8px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #tabbar::-webkit-scrollbar { display: none; }

    .tab-group {
      display: flex;
      align-items: stretch;
      padding: 0 4px;
      border-right: 1px solid #1e3158;
      gap: 1px;
    }
    .tab-group:last-child { border-right: none; }

    .tab-group-label {
      font-size: 9px;
      color: #3a5070;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      align-self: center;
      padding: 0 6px;
      white-space: nowrap;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 11px;
      font-size: 12px;
      color: #7890b0;
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      height: 40px;
    }
    .tab-btn:hover { color: #c8d3e0; background: rgba(255,255,255,0.04); }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: #4a8fe8;
      background: rgba(74, 143, 232, 0.1);
    }

    .tab-badge {
      background: #e74c3c;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      min-width: 16px;
      text-align: center;
      line-height: 14px;
    }

    /* ── Frame Container ── */
    #frame-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #131929;
    }

    .iframe-box {
      position: absolute;
      inset: 0;
      display: none;
    }
    .iframe-box.active { display: block; }

    .iframe-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #131929;
    }

    /* ── Version ── */
    #version {
      position: fixed;
      bottom: 6px;
      right: 10px;
      font-size: 9px;
      color: #2a3248;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="logo">📦 倉庫管理</div>
</div>

<!-- Tab Bar -->
<div id="tabbar">

  <!-- 倉庫管理 -->
  <div class="tab-group">
    <span class="tab-group-label">倉庫</span>
    <button class="tab-btn" data-tab="search">🔍 查貨</button>
    <button class="tab-btn" data-tab="adjust">📝 存庫調整</button>
    <button class="tab-btn" data-tab="bulk-import">
      📥 大量入庫
      <span class="tab-badge" id="badge-unlisted" style="display:none">0</span>
    </button>
    <button class="tab-btn" data-tab="products">🖼 產品資料</button>
    <button class="tab-btn" data-tab="overview">📊 庫存總覽</button>
    <button class="tab-btn" data-tab="stocktake">📋 盤點</button>
    <button class="tab-btn" data-tab="location">🗂️ 格位查詢</button>
  </div>

  <!-- 網店管理 -->
  <div class="tab-group">
    <span class="tab-group-label">網店</span>
    <button class="tab-btn" data-tab="shop-sync">
      🛒 存庫即時更新
      <span class="tab-badge" id="badge-lowstock" style="display:none">0</span>
    </button>
    <button class="tab-btn" data-tab="pickup">🏪 到店取</button>
    <button class="tab-btn" data-tab="shipping">📮 寄單</button>
  </div>

</div>

<!-- Frame Container -->
<div id="frame-container">

  <!-- 倉庫管理 -->
  <div class="iframe-box" data-tab="search">
    <iframe id="frameSearch" data-src="./search.html"></iframe>
  </div>
  <div class="iframe-box" data-tab="adjust">
    <iframe id="frameAdjust" data-src="./adjust.html"></iframe>
  </div>
  <div class="iframe-box" data-tab="bulk-import">
    <iframe id="frameBulkImport" data-src="./bulk-import.html"></iframe>
  </div>
  <div class="iframe-box" data-tab="products">
    <iframe id="frameProducts" data-src="./products.html"></iframe>
  </div>
  <div class="iframe-box" data-tab="overview">
    <iframe id="frameOverview" data-src="./overview.html"></iframe>
  </div>
  <div class="iframe-box" data-tab="stocktake">
    <iframe id="frameStocktake" data-src="./stocktake.html"></iframe>
  </div>
  <div class="iframe-box" data-tab="location">
    <iframe id="frameLocation" data-src="./location.html"></iframe>
  </div>

  <!-- 網店管理 -->
  <div class="iframe-box" data-tab="shop-sync">
    <iframe id="frameShopSync" data-src="./shop-sync.html"></iframe>
  </div>
  <div class="iframe-box" data-tab="pickup">
    <iframe id="framePickup" data-src="./pickup.html"></iframe>
  </div>
  <div class="iframe-box" data-tab="shipping">
    <iframe id="frameShipping" data-src="./shipping.html"></iframe>
  </div>

</div>

<div id="version">v2.0</div>

<script>
  // ── Tab 切換 ───────────────────────────────────────────────
  const tabs = document.querySelectorAll('.tab-btn')
  const boxes = document.querySelectorAll('.iframe-box')

  function activateTab(key) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === key))
    boxes.forEach(b => {
      const active = b.dataset.tab === key
      b.classList.toggle('active', active)
      if (active) {
        const iframe = b.querySelector('iframe')
        if (iframe && !iframe.src && iframe.dataset.src) {
          iframe.src = iframe.dataset.src  // lazy load，點到才載入
        }
      }
    })
    localStorage.setItem('wms_activeTab', key)
  }

  tabs.forEach(t => t.addEventListener('click', () => activateTab(t.dataset.tab)))

  // 還原上次 tab，預設 search
  activateTab(localStorage.getItem('wms_activeTab') || 'search')

  // ── Badge 更新（子頁面 postMessage）─────────────────────────
  // 子頁面發送格式：
  // window.parent.postMessage({ type: 'badge', key: 'lowstock', count: 3 }, '*')
  // key 可以是：'lowstock' | 'unlisted'
  window.addEventListener('message', e => {
    if (e.data?.type === 'badge') {
      const badge = document.getElementById(`badge-${e.data.key}`)
      if (!badge) return
      badge.textContent = e.data.count
      badge.style.display = e.data.count > 0 ? 'inline-block' : 'none'
    }
  })
</script>

</body>
</html>
